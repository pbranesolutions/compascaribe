<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compás Caribe — ¿Qué te gustaría que funcionara mejor?</title>
  <meta name="description" content="¿Qué te gustaría que funcionara mejor? Compás Caribe construye aplicaciones a la medida con clientes en República Dominicana.">
  <meta property="og:title" content="Compás Caribe">
  <meta property="og:description" content="¿Qué te gustaría que funcionara mejor?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://compascaribe.com">
  <meta name="theme-color" content="#12182a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0908'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f7efe8' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=DM+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip" href="#problem">Saltar a la respuesta</a>

  <div class="vista" aria-hidden="true">
    <div class="sky"></div>
    <div class="sea"></div>
    <div class="beach"></div>
    <div class="festoon">
      <svg class="wire" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
        <path vector-effect="non-scaling-stroke" d="M-2 10 C 4 12, 10 36, 16 34 S 24 18, 28 24 S 34 52, 39 48 S 46 30, 51 36 S 58 58, 63 52 S 70 20, 75 26 S 82 50, 86 44 S 92 12, 102 10" fill="none" stroke="#6b5344" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="bulb"></span>
      <span class="bulb"></span>
      <span class="bulb rose"></span>
      <span class="bulb"></span>
      <span class="bulb moon"></span>
      <span class="bulb"></span>
      <span class="bulb rose"></span>
      <span class="bulb"></span>
      <span class="bulb moon"></span>
    </div>
  </div>

  <main>
    <section id="stage" aria-labelledby="page-title">
      <div class="compose">
        <h1 id="page-title">¿Qué te gustaría que funcionara mejor?</h1>
        <form id="composer" action="#stage" method="get">
          <label class="sr-only" for="problem">Tu respuesta</label>
          <div class="composer">
            <textarea id="problem" name="problem" rows="2" maxlength="800" lang="es" enterkeyhint="send" autofocus></textarea>
            <button type="submit" class="send"><span class="sr-only">Empezar</span></button>
          </div>
          <p id="composer-error" class="error" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <div id="live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
